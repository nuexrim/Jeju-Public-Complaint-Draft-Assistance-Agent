# 평가용 정답 세트 (초안 2026-11-17, 사람 확인 필요)
#
# 쓰는 곳: complaint_agent/eval/run_eval.py (네트워크·유료 호출 없음)
#
# 항목
#   text      : 도민이 처음 하는 말 (일부는 제주어를 섞었다. 제주어 표현은 사전 확인 전 초안)
#   style     : standard(표준어) | dialect(제주어 섞임) | short_place(줄인 지명) | no_place(장소 없음) | multi_place(장소 여럿)
#   emd       : 문장만으로 알아들어야 할 읍면동. 없으면 null (그때는 고르기 목록이 나와야 정답)
#   places    : 근거를 계산할 때 사용자가 고를 장소 (emd 가 null 이거나 여러 곳일 때)
#   claims    : 불편 하나마다 한 줄. accept = 정답으로 인정하는 뜻(하나라도 맞으면 정답)
#               지표 id | gap:<빈칸 id>(자료 없음으로 안내) | template(범용 틀로 계산) | none(근거 자료 없음이 정답)
#   verdict   : 원자료로 사람이 확인한 판정. 엔진 결과로 채우지 않는다(순환 검증이 됨). 확인 전에는 비워 둔다.
#
# g01~g10 은 evidence_engine/tests/fixtures 의 q01~q10 과 같은 민원이다(문장 앞에 읍면동을 붙이거나 원문 그대로).

items:
  - id: g01
    text: "우리 동네 버스가 확 줄어부난 할망덜 병원 가기가 막 힘들어마씸"
    style: dialect
    emd: null
    places: [구좌읍]
    claims:
      - accept: [bus_usage_change_pct, "gap:bus_service"]
      - accept: [clinic_per_1k_elderly, clinic_per_1k_pop]
  - id: g02
    text: "애월읍 저녁에 집으로 가는 버스가 거의 없어서 학생들이 귀가하기 어렵습니다"
    style: standard
    emd: 애월읍
    claims:
      - accept: [evening_bus_share_jeju, "gap:bus_service"]
  - id: g03
    text: "노형동 학교 앞 교차로에서 교통사고가 자주 나서 아이들 등하교가 위험합니다"
    style: standard
    emd: 노형동
    claims:
      - accept: [school_risk_points, accident_hotspot_occurrences]
  - id: g04
    text: "성산읍 마을에서 버스 정류소까지 너무 멀어서 어르신들이 버스를 타기 힘듭니다"
    style: standard
    emd: 성산읍
    claims:
      - accept: [bus_stop_per_1k_pop]
      - accept: [elderly_bus_use_per_capita]
  - id: g05
    text: "표선면에 의원이 부족해서 어르신들이 진료를 받으려면 서귀포 시내까지 나가야 합니다"
    style: standard
    emd: 표선면
    claims:
      - accept: [clinic_per_1k_pop, clinic_per_1k_elderly]
  - id: g06
    text: "한경면은 밤에 아프면 갈 수 있는 약국이나 응급실이 근처에 없습니다"
    style: standard
    emd: 한경면
    claims:
      - accept: [night_pharmacy_count]
      - accept: [emergency_distance_km]
  - id: g07
    text: "이도2동 클린하우스가 항상 넘쳐서 쓰레기가 길에 쌓여 있습니다"
    style: standard
    emd: 이도2동
    claims:
      - accept: [clean_house_pop_per_site]
  - id: g08
    text: "대정읍 재활용도움센터가 멀어서 재활용품을 버리기가 불편합니다"
    style: standard
    emd: 대정읍
    claims:
      - accept: [recycling_center_per_10k_pop]
  - id: g09
    text: "한림읍 여름 폭염 때 어르신들이 더위를 피할 대피시설이 부족합니다"
    style: standard
    emd: 한림읍
    claims:
      - accept: ["gap:heat_shelter"]
  - id: g10
    text: "남원읍 태풍이 올 때 대피할 임시주거시설이 마을에서 너무 멉니다"
    style: standard
    emd: 남원읍
    claims:
      - accept: [refugee_facility_per_10k_pop]

  - id: g11
    text: "노형 사는데 밤길이 너무 어두워요 가로등 좀 달아 주세요"
    style: short_place
    emd: 노형동
    claims:
      - accept: ["gap:streetlight"]
  - id: g12
    text: "연동 골목에 CCTV가 없어서 밤에 무서워요"
    style: standard
    emd: 연동
    claims:
      - accept: [cctv_cameras_per_10k_pop]
  - id: g13
    text: "조천읍에 경로당이 부족해서 어르신들이 모일 데가 없어요"
    style: standard
    emd: 조천읍
    claims:
      - accept: [senior_center_per_1k_elderly]
  - id: g14
    text: "구좌 쪽에 편의점이 없어서 밤에 감기약 살 데가 없어요"
    style: short_place
    emd: 구좌읍
    claims:
      - accept: [otc_store_per_10k_pop]
  - id: g15
    text: "화북동 횡단보도 건너다 차에 치일 뻔한 적이 많아요 너무 위험해요"
    style: standard
    emd: 화북동
    claims:
      - accept: [pedestrian_accident_per_10k_pop]
  - id: g16
    text: "우도면에 병원이 하나도 어서마씸"
    style: dialect
    emd: 우도면
    claims:
      - accept: [clinic_per_1k_pop]
  - id: g17
    text: "안덕면 하르방덜 경로당이 너미 멀어마씸"
    style: dialect
    emd: 안덕면
    claims:
      - accept: [senior_center_per_1k_elderly]
  - id: g18
    text: "동홍동 버스 배차 간격이 너무 길어졌어요"
    style: standard
    emd: 동홍동
    claims:
      - accept: ["gap:bus_service"]
  - id: g19
    text: "중문동은 주말 진료 하는 병원이 없어요"
    style: standard
    emd: 중문동
    claims:
      - accept: ["gap:night_clinic"]
  - id: g20
    text: "삼양동은 응급실이 너무 멀어서 아이가 아플 때 걱정돼요"
    style: standard
    emd: 삼양동
    claims:
      - accept: [emergency_distance_km]
  - id: g21
    text: "아라동 버스 정류장이 너무 적어요"
    style: standard
    emd: 아라동
    claims:
      - accept: [bus_stop_per_1k_pop]
  - id: g22
    text: "한림읍 사거리에서 교통사고가 자주 나요"
    style: standard
    emd: 한림읍
    claims:
      - accept: [accident_hotspot_occurrences]
  - id: g23
    text: "외도동에 쓰레기 버릴 클린하우스가 부족해요"
    style: standard
    emd: 외도동
    claims:
      - accept: [clean_house_pop_per_site]
  - id: g24
    text: "구좌읍에 치매안심센터가 부족해서 부모님 모시기 힘들어요"
    style: standard
    emd: 구좌읍
    claims:
      - accept: [template]
  - id: g25
    text: "대정읍 공영주차장이 부족해요"
    style: standard
    emd: 대정읍
    claims:
      - accept: [none]
  - id: g26
    text: "애월읍 물가가 너무 올랐어요"
    style: standard
    emd: 애월읍
    claims:
      - accept: [none]
  - id: g27
    text: "노형동 놀이터가 부족해요"
    style: standard
    emd: 노형동
    claims:
      - accept: [none]
  - id: g28
    text: "병원이 너무 부족해요"
    style: no_place
    emd: null
    places: [표선면]
    claims:
      - accept: [clinic_per_1k_pop, clinic_per_1k_elderly]
  - id: g29
    text: "삼도2동이랑 용담1동 클린하우스가 넘쳐요"
    style: multi_place
    emd: null
    places: [삼도2동, 용담1동]
    claims:
      - accept: [clean_house_pop_per_site]
  - id: g30
    text: "추자면은 응급 상황 때 갈 병원이 없어서 불안합니다"
    style: standard
    emd: 추자면
    claims:
      - accept: [emergency_distance_km, clinic_per_1k_pop]
  - id: g31
    text: "버스가 줄어서 장 보러 가기 힘들어요"
    style: no_place
    emd: null
    places: [제주 전체]
    claims:
      - accept: [bus_usage_change_pct, "gap:bus_service"]
  - id: g32
    text: "봉개동 아이들 학교 가는 길이 위험해요"
    style: standard
    emd: 봉개동
    claims:
      - accept: [school_risk_points]
