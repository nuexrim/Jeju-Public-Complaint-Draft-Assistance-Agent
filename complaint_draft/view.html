<!DOCTYPE html>
<html lang="ko" style="font-size: __ROOT_PX__px">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 글자 크기는 html 의 font-size(보통 17px / 크게 20px)에 맞춰 rem 으로 따라간다. */
  :root {
    --ink: #1F2326; --muted: #4A5157; --line: #B9BEC2; --paper: #FFFFFF; --bg: #FFF8EE; --grey: #ECEAE6;
    --orange: #F7941D; --soft: #FFE9CC; --brown: #9A4100; --green: #2F6B2C; --green-soft: #E4F2E1;
    --surf: #F4F5F7; --border: #ECEEF1; --border-strong: #D5D9DE; --shadow: 0 4px 22px rgba(17,24,39,0.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4F5F7; color: var(--ink); line-height: 1.65;
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 1.1rem; }
  button { font: inherit; color: var(--ink); cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 4px 2px 20px; }
  .top h2 { margin: 0; font-size: 1.35rem; line-height: 1.3; }   /* 큰 제목은 화면 위 제목 띠에 있다 */
  .notice { margin: 0 2px 20px; padding: 0.8rem 1.3rem; border-radius: 16px; font-size: 1rem; font-weight: 500; background: #FFFFFF; }
  body.dia .notice { background: var(--soft); color: var(--brown); }
  .cols { display: flex; flex-wrap: wrap; gap: 28px; align-items: stretch; padding: 0 2px 28px; }   /* 민원서와 오른쪽 칸의 아래를 맞춘다 */
  article { flex: 1 1 560px; min-width: 280px; background: var(--paper); border: 0; border-radius: 24px; box-shadow: var(--shadow);
    padding: clamp(24px, 3.2vw, 44px); display: flex; flex-direction: column; gap: 22px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .chip { font-size: 0.95rem; font-weight: 700; color: var(--brown); background: var(--soft); border-radius: 999px; padding: 0.35rem 1.1rem; }
  .to { font-size: 0.95rem; font-weight: 500; color: var(--muted); }
  .doc-title { margin: 0; font-size: 1.75rem; font-weight: 800; line-height: 1.35; padding-bottom: 20px; border-bottom: 2px solid var(--ink);
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .sec { display: flex; flex-direction: column; gap: 8px; }
  .sec h3 { margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--brown); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .text { margin: 0; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
  .badge { font-size: 0.8rem; font-weight: 700; padding: 1px 12px; border-radius: 999px; background: var(--grey); color: var(--muted); }
  .badge.original { background: var(--soft); color: var(--brown); }
  .badge.edited { background: var(--green-soft); color: var(--green); }
  body.std .dia-only, body.dia .std-only { display: none; }
  aside { flex: 0 1 300px; min-width: 240px; display: flex; flex-direction: column; gap: 16px; font-size: 0.92rem; }  /* 오른쪽은 작게 */
  article#doc { flex: 1 1 560px; }
  .ev { background: linear-gradient(160deg, #EEF7EC 0%, var(--green-soft) 100%); border: 0; border-radius: 24px; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
  .ev h2 { margin: 0; font-size: 1.25rem; color: var(--green); }
  .ev-card { background: var(--paper); border-radius: 18px; padding: 18px; box-shadow: 0 2px 8px rgba(47,107,44,0.08); display: flex; flex-direction: column; gap: 4px; }
  .ev-name { font-size: 0.95rem; font-weight: 700; line-height: 1.45; }
  .ev-value { font-size: 1.6rem; font-weight: 800; color: #C25700; }
  .ev-src { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
  .ev-partial { font-size: 0.8rem; font-weight: 700; color: var(--brown); }
  .ev-compare { font-size: 0.85rem; line-height: 1.5; }
  .ev-stale { align-self: flex-start; font-size: 0.8rem; font-weight: 700; border: 1.5px dashed var(--ink); border-radius: 999px; padding: 0 10px; }
  .count { margin: -10px 0 0; font-size: 0.9rem; font-weight: 500; color: var(--muted); }
  .count .over { color: #B42318; font-weight: 700; }
  mark.dia-word { background: var(--soft); color: var(--ink); font-weight: 700; border-bottom: 3px solid var(--brown); padding: 0 3px; }
  .ev.none { background: var(--paper); border: 1px solid var(--border); }
  .ev.none h2 { color: var(--ink); }
  .ev-none-note { margin: 0; font-size: 0.95rem; line-height: 1.55; }
  .know { background: #FFFFFF; box-shadow: var(--shadow); border: 0; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
  .know h2 { margin: 0; font-size: 0.95rem; }
  .know p { margin: 0; font-size: 0.9rem; line-height: 1.55; color: var(--muted); }
  .actions { display: flex; flex-direction: column; gap: 12px; margin-top: auto; }   /* 단추는 오른쪽 칸 맨 아래로 */
  .act { border-radius: 999px; padding: 0.6rem 1rem; min-height: 56px; font-size: 1.05rem; font-weight: 700; background: var(--paper); border: 1.5px solid var(--border-strong); transition: border-color .12s ease, transform .12s ease; }
  .act:hover:not(:disabled) { border-color: var(--ink); transform: translateY(-1px); }
  .act.main { background: var(--orange); border-color: var(--orange); box-shadow: 0 8px 20px rgba(247,148,29,0.32); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .act.done { background: var(--green-soft); border-color: var(--green); }
  .act:disabled { background: var(--grey); border-color: var(--grey); color: #6B7177; cursor: not-allowed; }
  @media print {
    body { background: #fff; font-size: 12pt; }
    .top, .notice, aside, .badge { display: none !important; }
    article { border: 0; padding: 0; }
    body.dia .dia-only { display: none !important; }      /* 인쇄는 항상 표준어 */
    body.dia .std-only { display: block !important; }
  }
</style>
</head>
<body class="std">
  <div class="top">
    <h2>민원서 초안</h2>
  </div>
  <p class="notice std-only">행정기관에 내는 민원서입니다. 오른쪽 단추로 인쇄하거나 복사해서 쓰세요.</p>
  <p class="notice dia-only">하신 말씀이 제대로 들어갔는지 확인하는 화면입니다. 제출은 표준어로 합니다.</p>
  <div class="cols">
    <article id="doc"></article>
    <aside>
      <section class="ev" id="ev"></section>
      <div class="actions">
        <button type="button" class="act main" id="print">인쇄하기</button>
        <button type="button" class="act" id="txt">표준어 글로 받기 (.txt)</button>
        <button type="button" class="act copy" data-part="title">① 제목 복사하기</button>
        <button type="button" class="act copy" data-part="body">② 내용 복사하기</button>
        <div class="sr-only" id="hint" aria-live="polite"></div>
      </div>
    </aside>
  </div>
<script>
  const DRAFT = __DRAFT_JSON__;
  const doc = document.getElementById("doc");
  const hint = document.getElementById("hint");
  const copyBtns = [...document.querySelectorAll(".copy")];
  const printBtn = document.getElementById("print");
  const txtBtn = document.getElementById("txt");

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;   // 글은 textContent 로만 넣는다
    return e;
  }

  // 표준어본에 남은 제주어 낱말에 밑줄(mark)을 친다. 글은 textContent 로만 넣는다.
  const WORDS = DRAFT.dialect_words || [];
  const WORD_RE = WORDS.length
    ? new RegExp("(" + WORDS.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "g") : null;
  function textWithMarks(tag, cls, text) {
    const e = el(tag, cls);
    if (!WORD_RE) { e.textContent = text; return e; }
    for (const part of String(text).split(WORD_RE)) {
      if (!part) continue;
      if (WORDS.includes(part)) e.appendChild(el("mark", "dia-word", part));
      else e.appendChild(document.createTextNode(part));
    }
    return e;
  }
  function chars(n, limit, name) {
    const span = el("span", n > limit ? "over" : "", name + " " + n.toLocaleString() + " / " + limit.toLocaleString() + "자");
    return span;
  }

  function badges(parent, s) {
    if (s.edited) parent.appendChild(el("span", "badge edited", "직접 고친 글"));
  }

  // ---- 문서
  const sub = DRAFT.submission;
  const meta = el("div", "meta");
  if (sub.complaint_type) meta.appendChild(el("span", "chip", sub.complaint_type));
  if (sub.agency) meta.appendChild(el("span", "to", "받는 곳(예상): " + sub.agency));
  doc.appendChild(meta);

  let n = 0;
  for (const s of DRAFT.sections) {
    if (s.id === "title") {
      const h = el("h2", "doc-title");
      h.dataset.id = s.id;
      h.appendChild(textWithMarks("span", "std-only", s.standard));
      badges(h, s);
      doc.appendChild(h);
      // 국민신문고 글자 수 제한: 제목 200자, 내용 40,000자 (내용 칸에 붙여 넣는 글 전체 기준)
      const count = el("p", "count std-only");
      count.appendChild(chars(sub.title_chars, sub.title_limit || 200, "제목"));
      count.appendChild(document.createTextNode(" · "));
      count.appendChild(chars(sub.body_chars, sub.body_limit || 40000, "내용 칸"));
      doc.appendChild(count);
      continue;
    }
    // 근거가 없으면 문서(인쇄·화면)에서도 '근거 자료' 칸을 빼서, 복사되는 내용 칸 글과 같게 한다
    if (s.id === "evidence" && !DRAFT.evidence.length) continue;
    n += 1;
    const sec = el("section", "sec");
    sec.dataset.id = s.id;
    const h = el("h3", "", n + ". " + s.title);
    badges(h, s);
    sec.appendChild(h);
    sec.appendChild(s.id === "evidence" ? el("p", "text std-only", s.standard) : textWithMarks("p", "text std-only", s.standard));
    doc.appendChild(sec);
  }

  // ---- 근거 카드
  const ev = document.getElementById("ev");
  if (DRAFT.evidence.length) {
    ev.appendChild(el("h2", "", "제주 데이터 근거 " + DRAFT.evidence.length + "건"));
    for (const e of DRAFT.evidence) {
      const card = el("div", "ev-card");
      card.appendChild(el("div", "ev-name", e.indicator));
      card.appendChild(el("div", "ev-value", e.value_text));
      if (e.region_compare) card.appendChild(el("div", "ev-compare", e.region_compare));
      const srcs = (e.sources || []).map(x => x.publisher + " · 기준 " + x.as_of);
      card.appendChild(el("div", "ev-src", "출처: " + (srcs.length ? [...new Set(srcs)].join(" / ") : "정보 없음")));
      if (e.verdict === "partial") card.appendChild(el("div", "ev-partial", "일부만 확인된 근거"));
      if (e.stale) card.appendChild(el("div", "ev-stale", "오래된 자료 (기준일 2년 넘음)"));
      ev.appendChild(card);
    }
  } else {
    ev.classList.add("none");
    ev.appendChild(el("h2", "", "데이터로 확인된 근거가 없어요"));
    ev.appendChild(el("p", "ev-none-note", "근거 없이도 민원서는 낼 수 있어요. 불편한 점과 바라는 점이 그대로 들어갑니다."));
  }

  // ---- 보기 전환
  // 단추 아래 안내 글은 두지 않는다. 막힌 이유는 단추에 마우스를 올리면(title) 보이고, 화면 읽기 프로그램에는 hint 로 알린다.
  function refresh(mode) {
    let off = false, msg = "";
    if (!DRAFT.copy_allowed) { off = true; msg = "예시 결과라서 인쇄·복사할 수 없어요."; }
    else if (mode === "dia") { off = true; msg = "확인용 화면이에요. 표준어로 바꾸면 인쇄·복사할 수 있어요."; }
    for (const b of [...copyBtns, printBtn, txtBtn]) { b.disabled = off; b.title = msg; }
    hint.textContent = msg;
  }
  function setMode(mode) {
    document.body.className = mode;
    for (const b of document.querySelectorAll(".toggle button"))
      b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
    refresh(mode);
  }
  for (const b of document.querySelectorAll(".toggle button"))
    b.addEventListener("click", () => setMode(b.dataset.mode));

  // ---- 복사·인쇄
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    return ok;
  }
  for (const b of copyBtns)
    b.addEventListener("click", async () => {
      if (b.disabled) return;
      const part = b.dataset.part;
      const ok = await copyText(sub[part]);
      const name = part === "title" ? "제목" : "내용";
      // 복사 결과는 단추 글자로 잠깐 보여 준다(아래 안내 글 없이)
      const label = b.dataset.label || (b.dataset.label = b.textContent);
      b.textContent = ok ? "✓ " + name + " 복사했어요" : "복사하지 못했어요";
      b.classList.toggle("done", ok);
      hint.textContent = ok ? name + "을 복사했어요." : "복사하지 못했어요. 아래 '글로 받기'를 써 주세요.";
      setTimeout(() => { b.textContent = label; b.classList.remove("done"); }, 2500);
    });
  printBtn.addEventListener("click", () => { if (!printBtn.disabled) window.print(); });
  // 표준어 민원서를 글 파일로 받는다(제목 + 내용 칸 글). 글은 DRAFT 값 그대로.
  txtBtn.addEventListener("click", () => {
    if (txtBtn.disabled) return;
    const blob = new Blob([DRAFT.plain_text || ""], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "민원서_" + (DRAFT.request_id || "초안") + ".txt";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  // 화면(Streamlit)이 보기 방식과 단추 줄을 정해 넘긴다: 단추 줄을 바깥에 두면 안쪽 제목·전환 단추는 숨긴다
  const START_MODE = "__MODE__" === "dia" ? "dia" : "std";
  if (__HIDE_TOP__) document.querySelector(".top").style.display = "none";
  setMode(START_MODE);
</script>
</body>
</html>
