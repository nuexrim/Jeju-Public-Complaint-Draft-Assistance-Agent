# 적재 테이블 → 상위 개념(seed_core.ttl). 결정적 빌드에서 <테이블 클래스> rdfs:subClassOf <개념> 로 넣는다.
# 사람이 검수하는 연결표다. RIGOR LLM 보강을 돌리면 여기에 없는 하위 관계가 더 붙을 수 있다.
# 값 하나 = subClassOf, 여러 개 = 모두.  relations: 추가 존재 제약 (속성: 개념)
tables:
  dim_emd: [AdministrativeArea]
  pop_emd: [ResidentPopulation, ElderlyPopulation]
  emd_geo: [AdministrativeArea]
  elderly_pop_emd: [ElderlyPopulation]
  disabled_pop_emd: [DisabledPopulation]
  population_yearly: [ResidentPopulation]
  floating_pop_residence: [Visitors]
  floating_pop_visit: [Visitors]
  floating_pop_work: [Visitors]
  bus_stop: [TransportFacility]
  bus_route: [TransportFacility]
  bus_stop_usage_by_user_type: [BusRidership]
  bus_usage_monthly: [BusRidership]
  bus_boarding_hourly: [BusRidership]
  bus_yearly_passengers: [BusRidership]
  hospital: [Clinic]
  pharmacy: [PharmacyFacility]
  night_pharmacy: [PharmacyFacility]
  otc_drug_store: [PharmacyFacility]
  emergency_hospital: [EmergencyMedicalFacility]
  emergency_medical_center: [EmergencyMedicalFacility]
  health_center: [PublicHealthCenter]
  health_center_workforce: [Workforce]
