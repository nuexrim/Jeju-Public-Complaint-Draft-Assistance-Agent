  air_station: [EnvironmentalQuality]
  river_water_quality: [EnvironmentalQuality]
  weather_monthly: [WeatherCondition]
  weather_station: [WeatherCondition]
  civil_defense_shelter: [CivilDefenseShelterFacility]
  refugee_facility_jeju: [DisasterReliefShelter]
  refugee_facility_seogwipo: [DisasterReliefShelter]
  steep_slope_jeju: [Hazard]
  cctv: [SafetyFacility]
  accident_hotspot: [TrafficAccident]
  accident_by_intersection: [TrafficAccident]
  accident_child_by_hour: [TrafficAccident]
  accident_child_by_road: [TrafficAccident]
  accident_elderly: [TrafficAccident]
  pedestrian_accident: [TrafficAccident]
  traffic_enforcement: [TrafficAccident]
