  senior_center_seogwipo: [SeniorCenter]
  business_birth_death_emd: [Business]
  good_price_seogwipo: [Business, PriceLevel]
  price_index: [PriceLevel]
  price_survey: [PriceLevel]

relations:            # 테이블 클래스에 붙일 추가 관계 (seed 개념 간 관계를 테이블 수준에서 보강)
  accident_child_by_hour: {servesPopulation: Children}
  accident_child_by_road: {servesPopulation: Children}
  accident_elderly: {servesPopulation: ElderlyPopulation}
