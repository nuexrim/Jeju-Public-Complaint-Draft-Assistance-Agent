# RIGOR 입력용 컬럼 영문 식별자. RIGOR는 IRI에 ASCII만 남기므로(한글 → "_") 한글 컬럼명을 그대로 넘기면 서로 뭉개진다.
# 한글 원래 이름은 rdfs:label@ko 와 RAG 문서로 함께 넘긴다. 여기 없는 한글 컬럼은 내보내지 않는다(목록 출력됨).
