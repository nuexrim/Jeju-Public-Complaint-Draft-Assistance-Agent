# 불편 측면 단서 메모
#   어둡-: 밤길이 어둡다 = 불을 밝힐 시설(가로등)이 모자라다 → 시설 수(supply)
#   넘치-·꽉 차: 클린하우스가 넘친다 = 수거 시설이 모자라다 → 시설 수(supply)
#   " 어서마씸" 등: 제주어 '없어'. 앞에 띄어쓰기를 넣어 '줄어서마씸'(줄어서) 같은 연결 어미와 구별한다
