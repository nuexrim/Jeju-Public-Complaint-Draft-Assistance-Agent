#   먼저 맞는 측면을 쓰는 규칙상 위험(risk)으로 잘못 읽힌다(평가 g12·g30).
# 단서를 부정하면('멀지 않아요', '부족하지는 않아요', '안 멀어요') 측면으로 보지 않는다(library.cue_affirmed).

