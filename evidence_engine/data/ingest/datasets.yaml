# 수집·적재 대상 목록. 카탈로그(raw/jejudatahub/catalog_*.json)에 실제로 있는 id만 적는다.
# 컬럼명은 받은 파일의 실제 머리글이다(추측 금지).
#
# hub_files: 데이터허브 FILE (로그인·키 없이 누리집 내려받기 주소로 받음)
#   table  : DuckDB 테이블명
#   file   : 한 데이터셋에 파일이 여럿일 때 파일명에 들어 있는 문자열
#   period : {column, format}  format = yyyy | yyyymm | yyyymmdd | yyyy-mm-dd | year_month(columns: [연, 월])
#   emd    : {mode: name, columns: [...]}     읍면동명이 들어 있는 컬럼
#            {mode: address, columns: [...]}  주소 문자열에서 읍면동명을 찾음
#   ragged : {column, int_columns}  따옴표 없이 쉼표가 들어간 컬럼이 있는 파일
#   latlon : [위도컬럼, 경도컬럼]  행정동 경계 확보 후 공간조인에 쓴다(지금은 기록만)
# 데이터허브 API(프로젝트 키 필요), 공공데이터포털 링크 데이터는 키·파일 확보 후 추가한다.
