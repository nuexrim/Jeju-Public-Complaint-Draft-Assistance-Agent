# hub_apis: 데이터허브 Open API (프로젝트 키 필요, 과금 없음, API별 하루 쿼터 1,000건)
#   각 API를 계정의 프로젝트에 "프로젝트 담기" 해야 호출된다(안 하면 403).
#   응답은 raw/jejudatahub/api/<id>.json 원본과 <id>.csv 평탄화본으로 저장한다.
#   컬럼명은 카탈로그의 응답 항목명이다. 실제 응답과 다르면 적재 단계에서 오류로 멈춘다.
hub_apis:
  - {id: 612, complaint: 교통, table: bus_stop, emd: {mode: address, columns: [stationAddress]}, latlon: [latitude, longitude]}
  - {id: 611, complaint: 교통, table: bus_route}
  - {id: 863, complaint: 교통, table: accident_hotspot, emd: {mode: address, columns: [occurrencePlace]}, latlon: [latitude, longitude]}
  - {id: 859, complaint: 의료 접근, table: hospital, emd: {mode: address, columns: [addressDoro, addressJibun]}}
  - {id: 861, complaint: 의료 접근, table: pharmacy, emd: {mode: address, columns: [addressDoro, addressJibun]}}
  - {id: 578, complaint: 안전·재난, table: weather_station, latlon: [latitude, longitude]}
