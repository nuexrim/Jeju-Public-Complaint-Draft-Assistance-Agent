# 민원서 작성 도우미 화면 설정 (streamlit run complaint_draft/app.py 를 저장소 맨 위에서 실행할 때 적용)
# 센터 PC 실행용(운영) 설정이다. 개발할 때 바꾸려면 명령줄에서 덮어쓴다(예: --client.showErrorDetails full).
[theme]
base = "light"
primaryColor = "#F7941D"
backgroundColor = "#FFF8EE"
secondaryBackgroundColor = "#FFE9CC"
textColor = "#1F2326"

[server]
# 이 PC에서만 열린다. 같은 네트워크의 다른 컴퓨터가 주소로 들어와 평가용 Claude 키를 쓰지 못하게 한다.
address = "localhost"
headless = false             # 실행하면 브라우저가 자동으로 열린다
fileWatcherType = "none"     # 운영: 코드 바뀜을 감시하지 않는다(실행 중 파일이 바뀌어 화면이 다시 그려지는 일 방지)
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"      # 오른쪽 위 Deploy 단추를 숨긴다
showErrorDetails = "none"    # 오류가 나도 화면에는 짧은 안내만(코드 위치·내용은 실행 창 기록에만 남는다)
